[package]
name = "execution_utils"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
verifier_common = { workspace = true, features = ["proof_utils", "replace_csr"] }
risc_v_simulator = { workspace = true, features = ["delegation"] }
trace_and_split = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"

[dev-dependencies]
prover_examples = { path = "../circuit_defs/prover_examples" }
bincode = { version = "1.3" }
# SYSCOIN: Real main+SHA delegation full-statement proof regression.
full_statement_verifier = { path = "../full_statement_verifier", features = ["replace_csr"] }
lib-rv32-asm = {git = "https://github.com/shamatar/lib-rv32.git"}
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"

[features]
# Will evaluate quotient on main domain for debug
debug_satisfiable = ["prover_examples/debug_satisfiable"]
# Will perform satisfiability tests on witness
precheck_satisfied = ["prover_examples/precheck_satisfied"]
extended_tests = []
# debug = ["prover_examples/precheck_satisfied", "prover_examples/debug_satisfiable"]
release_verifier_artifacts = []
# Internal-only bootstrap mode used by tools/verifier/build_vk.sh. It permits
# the generate-vk command to compile before the ROM/VK release bundle exists.
vk_generation_without_artifacts = []
default = ["release_verifier_artifacts"]
# default = ["extended_tests"]

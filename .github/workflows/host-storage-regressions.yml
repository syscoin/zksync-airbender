name: Host storage regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host-storage-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      ZKSYNC_USE_CUDA_STUBS: "1"
      RUSTFLAGS: "--cfg no_cuda"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Load the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check replay, teardown and partial-copy cleanup
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          check_tests() {
            local count=$1
            shift
            cargo test --locked -p gpu_prover --lib --features memory_sweep "$@" | tee "$RUNNER_TEMP/host-storage-tests.log"
            grep -Fq "test result: ok. $count passed; 0 failed; 0 ignored;" "$RUNNER_TEMP/host-storage-tests.log"
          }
          check_tests 2 witness::trace::tests
          check_tests 1 execution::cpu_worker::tests::teardown_chunks_preserve_order_across_partitions_and_allocators -- --exact
          check_tests 1 prover::setup::tests::setup_copy_failure_discards_partially_written_storage -- --exact
